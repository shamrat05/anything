name: Anything Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing key
        env:
          FASTSEARCH_SIGNING_BUNDLE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.FASTSEARCH_SIGNING_BUNDLE || '' }}
        run: python3 scripts/setup-signing.py
      - name: Check query and root protocol semantics
        timeout-minutes: 2
        run: |
          mkdir -p dist
          scripts/check.sh | tee dist/HOST-CHECKS.txt
      - name: Build APKs and run lint
        run: scripts/build.sh :app:assembleFullDebug :app:assembleFullRelease :app:assemblePlayRelease :app:bundlePlayRelease :app:assembleFullDebugAndroidTest :app:lintFullDebug :app:lintPlayRelease --console=plain
      - name: Package APKs, source and checksums
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: anything-android-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-${{ github.sha }}
          path: app/build/reports/lint-results-*.*
          if-no-files-found: ignore
