name: Anything Android compatibility
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Android emulator API (37.0 currently has a documented renderer failure)
        type: choice
        default: '29'
        options: ['29', '37.0']
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_AVD_HOME: /home/runner/anything-avd
    strategy:
      fail-fast: false
      matrix:
        # Keep the failing API37 renderer available explicitly without repeating it on every push.
        platform: ["${{ inputs.platform || '29' }}"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          # Keep the explicitly selected NDK; remove unused preinstalled versions.
          for ndk in "$ANDROID_HOME"/ndk/*; do
            if [[ "${ndk##*/}" != 28.2.13676358 ]]; then sudo rm -rf "$ndk"; fi
          done
          df -h /home/runner
      - name: Install SDK and emulator
        env:
          TEST_PLATFORM: ${{ matrix.platform }}
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' emulator "system-images;android-$TEST_PLATFORM;google_apis;x86_64"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name compatibility --package "system-images;android-$TEST_PLATFORM;google_apis;x86_64" --device pixel_2
          echo disk.dataPartition.size=2G >> "$ANDROID_AVD_HOME/compatibility.avd/config.ini"
      - name: Prepare signing key
        run: python3 scripts/setup-signing.py
      - name: Build isolated test application
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
        run: scripts/build.sh -PfastsearchApplicationId=com.callcraftstudio.anything.fresh :app:assembleFullDebug :app:assembleFullDebugAndroidTest --console=plain
      - name: Run native runtime probes
        timeout-minutes: 15
        run: |
          mkdir -p compatibility-results
          "$ANDROID_HOME/emulator/emulator" -avd compatibility -no-window -no-audio -cores 2 -memory 2048 -partition-size 2048 -feature -Vulkan -no-boot-anim -no-snapshot -gpu swiftshader > compatibility-results/emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          timeout 420 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 2; done'
          trap 'adb logcat -b all -d > compatibility-results/device.log 2>&1 || true; df -h > compatibility-results/disk.txt' EXIT
          adb shell input keyevent 82
          timeout 120 adb install --no-streaming -t app/build/outputs/apk/full/debug/app-full-debug.apk
          timeout 120 adb install --no-streaming -t app/build/outputs/apk/androidTest/full/debug/app-full-debug-androidTest.apk
          for probe in RootScannerProbe RenamePreviewProbe PreviewProbe OperationUpdateProbe UpdateProbe ThumbnailEfficiencyProbe UiProbe HelpProbe; do
            probe_args=()
            if [[ "$probe" == UiProbe ]]; then probe_args=(-e pinchOnly true); fi
            timeout 180 adb shell am instrument -w -r -e root false "${probe_args[@]}" com.callcraftstudio.anything.fresh.test/dev.fastsearch.android.$probe > compatibility-results/$probe.log
            grep -q 'INSTRUMENTATION_RESULT: passed=true' compatibility-results/$probe.log
            grep -q 'INSTRUMENTATION_CODE: -1' compatibility-results/$probe.log
          done
          adb logcat -b crash -d > compatibility-results/crash.log
          adb shell getprop ro.build.version.sdk > compatibility-results/api.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ matrix.platform }}-${{ github.sha }}
          path: compatibility-results/
